; Canonical method ID: reparameterized_no_planck
; This is the explicit, reproducible configuration corresponding to the
; completed No-Planck reparameterized chain.  It differs from the With-Planck
; configuration only through the prior file and independent output paths.
%include ../config/pipeline2x2pt_weyl_reparameterized_with_planck.ini

[pipeline]
priors = ../config/shared/priors_weyl_no_planck.ini

[output]
filename = ../chain/chain_reparameterized_no_planck_nautilus.txt

[test]
save_dir = output/test_reparameterized_no_planck
fatal_errors = T
