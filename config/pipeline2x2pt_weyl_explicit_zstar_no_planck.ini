; Canonical method ID: explicit_zstar_no_planck
; Explicit-z_star run with the broad No-Planck priors.  No parameter range or
; likelihood is changed for points
; that gRPT evaluates successfully.
;
; Some extreme broad-prior power-spectrum shapes make the legacy adaptive
; gRPT quadrature fail to return for hours.  Isolating wedges in a child
; process lets the pipeline reject only those numerically non-evaluable
; points after a deliberately generous five-minute wall-clock limit.
%include ../config/pipeline2x2pt_weyl_explicit_zstar_with_planck.ini

[pipeline]
priors = ../config/shared/priors_weyl_no_planck.ini

[wedges]
fork_wedges = T
timeout = 300.0

[output]
filename = ../chain/chain_explicit_zstar_no_planck_nautilus.txt

[test]
save_dir = output/test_explicit_zstar_no_planck
fatal_errors = T
