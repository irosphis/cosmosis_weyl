; Canonical method ID: explicit_zstar_with_planck
; Explicit-z_star reconstruction.  This file inherits all unchanged data,
; likelihood, nuisance and scale-cut settings from the reparameterized run.
; It has independent output/checkpoint paths and does not modify old chains.
%include ../config/pipeline2x2pt_weyl_reparameterized_with_planck.ini

[pipeline]
modules = sample_S8 sigma8toAs correlated_dz_priors one_parameter_hmcode camb reparameterized_amplitudes zstar_boss_prepare wedges zstar_boss_restore approximate_P_gm extrapolate_power load_nz_fits source_photoz_bias linear_alignment magnification_alphas zstar_matter_galaxy_power projection apply_zstar_amplitudes add_intrinsic add_magnification bandpower_ggl scale_cuts BOSS_like 2x2pt_like
extra_output = cosmological_parameters/S_8 cosmological_parameters/sigma_8 cosmological_parameters/sigma_12 cosmological_parameters/A_s cosmological_parameters/omega_m cosmological_parameters/omega_nu cosmological_parameters/omega_lambda cosmological_parameters/cosmomc_theta nofz_shifts/bias_1 nofz_shifts/bias_2 nofz_shifts/bias_3 nofz_shifts/bias_4 nofz_shifts/bias_5 delta_z_out/bin_1 delta_z_out/bin_2 delta_z_out/bin_3 delta_z_out/bin_4 delta_z_out/bin_5 lss_parameters/fsigma_8_bin_1 lss_parameters/fsigma_8_bin_2 reparameterized_derived/sigma8_ref_bin_1 reparameterized_derived/sigma8_ref_bin_2 reparameterized_derived/b1_eff_bin_1 reparameterized_derived/b1_eff_bin_2 reparameterized_derived/f_eff_bin_1 reparameterized_derived/f_eff_bin_2 reparameterized_derived/eg_bin_1 reparameterized_derived/eg_bin_2 zstar_derived/z_star zstar_derived/sigma8_star zstar_derived/z_star_ggl zstar_derived/sigma8_star_ggl zstar_derived/nonlinear_bias_correction_rms_fraction zstar_derived/bhat_jhat_bin_1 zstar_derived/bhat_jhat_bin_2

[output]
filename = ../chain/chain_explicit_zstar_with_planck_nautilus.txt

[test]
save_dir = output/test_explicit_zstar_with_planck
fatal_errors = T

[zstar_boss_prepare]
file = ./../cosmosis_modules/zstar_boss_power.py
mode = prepare
z_star = 5.0
backup_section = zstar_power_backup
derived_section = zstar_derived

[wedges]
use_zstar = T

[zstar_boss_restore]
file = ./../cosmosis_modules/zstar_boss_power.py
mode = restore
z_star = 5.0
backup_section = zstar_power_backup
derived_section = zstar_derived

[zstar_matter_galaxy_power]
file = ./../cosmosis_modules/zstar_matter_galaxy_power.py
z_star = 5.0
z_sep = 0.5
include_nonlinear_bias_correction = T
bhat_section = growth_amplitudes
bias_section = bias_parameters
derived_section = zstar_derived

[apply_zstar_amplitudes]
file = ./../cosmosis_modules/apply_zstar_amplitudes.py
cl_section = galaxy_shear_cl
bhat_section = growth_amplitudes
jhat_section = J_bin_bias
derived_section = zstar_derived
